
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Love Letter ❤️</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hearts" id="hearts"></div>

    <main class="window">
        <div class="title-bar">
            <span>LOVE ❤️</span>
            <div class="window-buttons">
                <span>−</span>
                <span>□</span>
                <span>×</span>
            </div>
        </div>

        <div class="menu">
            ❤️ • ❤️ • ❤️ • ❤️
        </div>

        <section class="content">
            <h2>Hello my love, Sorry for being moody ♡</h2>
            <p>Do you still love me?</p>

            <div class="cat">
                <div class="ears">
                    <span></span>
                    <span></span>
                </div>
                <div class="face">
                    <div class="eyes">
                        <span></span>
                        <span></span>
                    </div>
                    <div class="nose"></div>
                    <div class="cheeks">
                        <span></span>
                        <span></span>
                    </div>
                    <div class="mouth">♥</div>
                </div>
            </div>

            <div class="buttons">
                <button id="yesBtn">YES 💗</button>
                <button id="noBtn">NO</button>
            </div>

            <p id="message"></p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
